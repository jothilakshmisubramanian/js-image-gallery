<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Image Gallery </h1>
    <p>Discover • Explore • Enjoy</p>
        <!-- Main Image -->
        <div class="image-box">
            <img class="gallery-image" src="images\image 1.jpg">
            <img class="gallery-image" src="images\image 2.png">
            <img class="gallery-image" src="images\image 3.jpg">
            <img class="gallery-image" src="images\image 4.jpg">
            <img class="gallery-image" src="images\image 5.jpg">
        </div>
<!-- Navigation Buttons -->
        <div class="controls">
            <button id="prev-button">Previous</button>
            <button id="next-button">Next</button>
        </div>

        <script src="script.js"></script>
</body>

</html>
